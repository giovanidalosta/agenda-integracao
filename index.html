<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda de Integração - Ikatec</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
  <header class="app-header">
    <div class="app-header__inner">
      <span class="app-header__brand">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="14" fill="#09A8C9" />
          <path d="M8 14h12M14 8v12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
        </svg>
        Ikatec &middot; Gerador de Agenda
      </span>
    </div>
  </header>

  <main class="layout">
    <aside class="panel panel--form">
      <div class="panel__title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />
        </svg>
        Dados do Colaborador
      </div>
      <div class="field">
        <label for="collabName">Nome completo</label>
        <input type="text" id="collabName" placeholder="Ex.: Maria Oliveira" autocomplete="off" />
      </div>
      <div class="field">
        <label for="integrationDate">Data da integração</label>
        <input type="date" id="integrationDate" />
      </div>
      <div class="divider"></div>
      <div class="panel__title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
        Atividades
      </div>
      <div id="activitiesContainer"></div>
      <button id="addActivityBtn" class="btn btn--ghost btn--full">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 5v14M5 12h14" />
        </svg>
        Adicionar atividade
      </button>
      <div class="divider"></div>
      <button id="generateBtn" class="btn btn--primary btn--full">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
        Gerar Agenda
      </button>
      <div class="export-row">
        <button id="exportPdfBtn" class="btn btn--outline">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
          </svg>
          Exportar PDF
        </button>
        <button id="exportPngBtn" class="btn btn--outline">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <polyline points="21 15 16 10 5 21" />
          </svg>
          Exportar PNG
        </button>
      </div>
    </aside>

    <section class="panel panel--preview">
      <div class="panel__title panel__title--preview">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
        Pre-visualizacao
      </div>
      <div class="a4-wrapper">
        <div id="agendaDoc" class="agenda-doc"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
